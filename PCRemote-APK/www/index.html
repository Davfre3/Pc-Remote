<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>PC Remote</title>
<style>
  :root { --bg:#0d1117; --card:#151b23; --card2:#1b232d; --line:#263041; --txt:#e6edf3; --mut:#8b98a9;
          --acc:#4f8cff; --ok:#2ecc71; --bad:#ff5d5d; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt); font:15px/1.4 system-ui,sans-serif; overscroll-behavior:none; }
  body { padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left)); overflow-y:auto; }
  .wrap { max-width:960px; margin:0 auto; display:grid; grid-template-columns:minmax(230px,300px) 1fr; gap:16px; align-items:start; }
  @media (max-width:640px) { .wrap { grid-template-columns:1fr; } }
  .hero { text-align:center; padding:6px 0; }
  .logo { width:64px; height:64px; margin:0 auto 6px; border-radius:16px; background:var(--acc); display:grid; place-items:center; font-size:34px; }
  h1 { margin:0 0 2px; font-size:22px; }
  .sub { color:var(--mut); font-size:13px; margin-bottom:12px; }
  button { font:inherit; color:var(--txt); border:0; cursor:pointer; }
  .big { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:13px 14px; border-radius:14px; font-weight:700; margin-top:8px; background:var(--card2); border:1px solid var(--line); }
  .big.pri { background:var(--acc); border-color:var(--acc); color:#fff; }
  .big:active, .go:active { transform:scale(.98); }
  .modes { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:5px; margin-bottom:6px; }
  .modes button { padding:9px 4px; border-radius:10px; background:transparent; font-weight:700; font-size:13.5px; color:var(--mut); }
  .modes button.cur { background:var(--acc); color:#fff; }
  .mode { display:none; } .mode.cur { display:block; }
  .upd { display:none; align-items:center; gap:10px; padding:10px 12px; margin:0 0 10px; border-radius:14px; background:rgba(79,140,255,.14); border:1px solid var(--acc); text-align:left; font-size:13px; }
  .upd.show { display:flex; } .upd .t { flex:1; } .upd .t span { display:block; color:var(--mut); font-size:12px; }
  .upd button { background:var(--acc); color:#fff; font-weight:700; padding:8px 12px; border-radius:10px; }
  .upd button:disabled { background:var(--line); color:var(--mut); }
  #scan { position:relative; width:100%; aspect-ratio:4/3; max-height:62vh; background:#000; border-radius:14px; overflow:hidden; }
  #scan video { width:100%; height:100%; object-fit:cover; }
  #scan::after { content:""; position:absolute; inset:18%; border:3px solid rgba(255,255,255,.85); border-radius:16px; }
  h2 { margin:0 0 8px; font-size:12px; letter-spacing:.09em; text-transform:uppercase; color:var(--mut); }
  .pc { display:flex; align-items:center; gap:12px; padding:12px 14px; margin-bottom:8px; border-radius:14px; background:var(--card); border:1px solid var(--line); }
  .pc .ic { font-size:26px; flex:none; }
  .pc .nm { flex:1; min-width:0; }
  .pc .nm b { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pc .nm span { color:var(--mut); font-size:12.5px; }
  .go { background:var(--acc); color:#fff; font-weight:800; padding:10px 18px; border-radius:12px; }
  .rm { background:transparent; color:var(--mut); font-size:18px; padding:8px 10px; border-radius:10px; }
  .empty { color:var(--mut); padding:14px; border:1px dashed var(--line); border-radius:14px; font-size:14px; }
  .empty ol { margin:8px 0 0; padding-left:20px; }
  #status { margin-top:10px; min-height:1.4em; font-size:13.5px; color:var(--mut); text-align:center; }
  #status.err { color:var(--bad); } #status.ok { color:var(--ok); }
  .ov { position:fixed; inset:0; background:rgba(0,0,0,.88); display:none; place-items:center; z-index:5; padding:16px; }
  .ov.show { display:grid; }
  .box { width:min(100%,460px); max-height:100%; overflow-y:auto; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; }
  label { display:block; font-size:12.5px; color:var(--mut); margin:10px 0 4px; }
  input { width:100%; font:inherit; color:var(--txt); background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:11px 12px; }
  .fields { display:grid; grid-template-columns:1fr 110px; gap:0 8px; }
  .f-pin { grid-column:1 / -1; }
  .fields.nomanual .f-ip, .fields.nomanual .f-port { display:none; }
  .fields.nomanual .f-pin input { font-size:26px; letter-spacing:.18em; text-align:center; }
  /* horizontal y bajito (con el teclado abierto): los tres campos en una sola fila */
  @media (max-height:520px) and (min-width:560px) {
    .box { width:min(100%,680px); padding:10px 14px; }
    .fields { grid-template-columns:1.6fr .6fr 1fr; } .f-pin { grid-column:auto; }
    .fields.nomanual { grid-template-columns:1fr; }
    label { margin:4px 0 2px; } input { padding:8px 10px; } .row { margin-top:8px; } .box h2 { margin-bottom:0; }
  }
  .row { display:flex; gap:8px; margin-top:14px; } .row button { flex:1; margin:0; }
  .hint { color:var(--mut); font-size:13px; margin:8px 0 0; }
  #btlist { margin-top:10px; max-height:46vh; overflow-y:auto; }
  .dev { display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:11px 12px; margin-bottom:6px; border-radius:12px; background:var(--card2); border:1px solid var(--line); }
  .dev .ic { font-size:24px; flex:none; }
  .dev .nm { flex:1; min-width:0; }
  .dev .nm b { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dev .nm span { color:var(--mut); font-size:12.5px; }
  .dev.pcdev { border-color:var(--acc); }
  .dev:active { transform:scale(.99); }
  #btstat { color:var(--mut); font-size:13.5px; margin-top:8px; min-height:1.4em; }
  #btstat.err { color:var(--bad); }
  .spin { display:inline-block; width:12px; height:12px; border:2px solid var(--mut); border-top-color:transparent; border-radius:50%; animation:r .8s linear infinite; vertical-align:-2px; margin-right:6px; }
  @keyframes r { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div class="logo">🎮</div>
    <h1>PC Remote</h1>
    <div class="sub">Tu móvil como mando del PC · <span id="appver"></span></div>
    <div class="upd" id="upd"><div class="t"><b id="updt"></b><span id="updd"></span></div><button id="updb">Actualizar</button></div>
    <div class="modes" id="modes">
      <button data-m="wifi">📶 WiFi</button><button data-m="bt">🔷 Bluetooth</button><button data-m="usb">🔌 Cable</button>
    </div>
    <div class="mode" data-m="wifi">
      <button class="big pri" id="scanbtn">📷 Escanear código QR</button>
      <button class="big" id="findbtn">🔎 Buscar PC en mi WiFi</button>
      <button class="big" id="manualbtn">⌨ Escribir dirección y PIN</button>
    </div>
    <div class="mode" data-m="bt">
      <button class="big pri" id="btbtn">🔷 Buscar el PC por Bluetooth</button>
    </div>
    <div class="mode" data-m="usb">
      <button class="big pri" id="usbbtn">🔌 Buscar el PC por cable USB</button>
    </div>
    <div id="status"></div>
  </section>
  <section>
    <h2>Mis PC</h2>
    <div id="list"></div>
  </section>
</div>

<div class="ov" id="scanov"><div class="box">
  <div id="scan"><video id="vid" playsinline muted></video></div>
  <p class="hint" id="scanmsg">Apunta al código QR que sale en el panel de PC Remote del ordenador</p>
  <div class="row"><button class="big" id="scanclose">Cancelar</button></div>
</div></div>

<div class="ov" id="manov"><div class="box">
  <h2 id="mantitle">Conectar con el PC</h2>
  <div class="fields" id="manfields">
    <div class="f-ip"><label for="ip">Dirección (IP) del PC</label><input id="ip" inputmode="decimal" placeholder="192.168.1.20" autocomplete="off"></div>
    <div class="f-port"><label for="port">Puerto</label><input id="port" inputmode="numeric" value="8765"></div>
    <div class="f-pin"><label for="pin">PIN (en el panel del PC)</label><input id="pin" autocomplete="off" autocapitalize="none" placeholder="a1b2c3"></div>
  </div>
  <div class="row"><button class="big" id="manclose">Cancelar</button><button class="big pri" id="mango">Conectar</button></div>
</div></div>

<div class="ov" id="btov"><div class="box">
  <h2>Bluetooth</h2>
  <p class="hint">Elige tu PC. En el PC deja abierto PC Remote y, si no aparece, abre Configuración > Bluetooth (el panel tiene un botón para eso).</p>
  <div id="btstat"></div>
  <div id="btlist"></div>
  <div class="row"><button class="big" id="btclose">Cerrar</button><button class="big pri" id="btagain">Buscar de nuevo</button></div>
</div></div>

<script src="jsQR.js"></script>
<script>
const $ = id => document.getElementById(id);
const KEY = 'pcr_pcs', BT_UUID = '7a1f2b64-3c5d-4e8a-9b10-5043524d4f54';
let pcs = [];
try { pcs = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(pcs)); } catch (e) {} };
const say = (t, cls = '') => { $('status').textContent = t; $('status').className = cls; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const errText = e => (e && (e.message || e.errorMessage)) || String(e || 'error');
const BTP = () => window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.BtPad;
const timeout = ms => { const c = new AbortController(); setTimeout(() => c.abort(), ms); return c.signal; };

function render() {
  const L = $('list');
  if (!pcs.length) {
    L.innerHTML = `<div class="empty"><b>Aún no hay ningún PC.</b><ol>
      <li>Abre <b>PC Remote</b> en tu ordenador y mira el <b>PIN</b> del panel.</li>
      <li>Elige <b>WiFi</b> (escanea el QR), <b>Bluetooth</b> o <b>Cable</b>, la misma que elegiste en el PC.</li>
      <li>Elige tu PC, escribe el PIN y <b>juega</b>.</li></ol></div>`;
    return;
  }
  L.innerHTML = '';
  [...pcs].sort((a, b) => (b.last || 0) - (a.last || 0)).forEach(p => {
    const d = document.createElement('div'); d.className = 'pc';
    d.innerHTML = `<div class="ic">${p.bt ? '🔷' : '🖥'}</div><div class="nm"><b>${esc(p.name || 'Mi PC')}</b><span>${p.bt ? 'Bluetooth' : esc(p.addr)}</span></div>
      <button class="go">Jugar</button><button class="rm" aria-label="Quitar">✕</button>`;
    d.querySelector('.go').onclick = () => p.bt ? btPlay(p) : connect(p);
    d.querySelector('.rm').onclick = () => { if (confirm('¿Quitar "' + (p.name || p.addr || 'este PC') + '" de la lista?')) { pcs = pcs.filter(x => x !== p); save(); render(); } };
    L.appendChild(d);
  });
}

// ---- credenciales: dirección (si hace falta) y PIN ----
let askCb = null;
function ask({ title, ip = '', port = '8765', pin = '', manual = false }, cb) {
  $('mantitle').textContent = title;
  $('manfields').classList.toggle('nomanual', !manual);
  $('ip').value = ip; $('port').value = port; $('pin').value = pin;
  askCb = cb; $('manov').classList.add('show');
  setTimeout(() => $(manual && !ip ? 'ip' : 'pin').focus(), 150);
}
$('manclose').onclick = () => { $('manov').classList.remove('show'); askCb = null; };
$('mango').onclick = () => {
  const ip = $('ip').value.trim(), port = $('port').value.trim() || '8765', pin = $('pin').value.trim();
  if (!/^[\w.\-]+$/.test(ip) || !/^\d{2,5}$/.test(port) || !pin) { say('Escribe la dirección, el puerto y el PIN.', 'err'); return; }
  const cb = askCb; $('manov').classList.remove('show'); askCb = null;
  if (cb) cb(`${ip}:${port}`, pin);
};
for (const id of ['ip', 'port', 'pin']) $(id).addEventListener('focus', () => setTimeout(() => $(id).scrollIntoView({ block:'center' }), 300));
$('pin').addEventListener('keydown', e => { if (e.key === 'Enter') $('mango').click(); });

// Comprueba que la direccion es un PC Remote y que el PIN vale; si todo va bien guarda el PC y abre el mando
async function connect(p) {
  say('Conectando con ' + (p.name || p.addr) + '…');
  let hello = null;
  for (const a of [p.addr, ...(p.alts || [])]) {   // la direccion de siempre y, si no, las otras con las que ya conecto
    try { hello = await (await fetch(`http://${a}/hello`, { signal: timeout(a === p.addr ? 4500 : 1500), cache: 'no-store' })).json(); } catch (e) { continue; }
    if (a !== p.addr) { p.alts = [p.addr, ...(p.alts || [])].filter((x, i, l) => x !== a && l.indexOf(x) === i).slice(0, 6); p.addr = a; }
    break;
  }
  if (!hello) { say('No se encuentra el PC. Comprueba que PC Remote está abierto y que el móvil está en la misma WiFi (el firewall de Windows puede pedir permiso la primera vez).', 'err'); return; }
  if (hello.app !== 'pcremote') { say('Esa dirección no es un PC Remote.', 'err'); return; }
  try {
    const r = await fetch(`http://${p.addr}/info?k=${encodeURIComponent(p.pin)}`, { signal: timeout(4500), cache: 'no-store' });
    if (r.status === 403) { say('El PIN no es correcto.', 'err'); ask({ title: 'PIN incorrecto: míralo en el panel del PC', ip: p.addr.split(':')[0], port: p.addr.split(':')[1], pin: '' }, (addr, pin) => { p.pin = pin; connect(p); }); return; }
    if (!r.ok) throw 0;
  } catch (e) { say('El PC no respondió. Inténtalo otra vez.', 'err'); return; }
  p.name = hello.name || p.name; p.last = Date.now();
  if (!pcs.includes(p)) { const old = pcs.find(x => x.addr === p.addr); if (old) Object.assign(old, p); else pcs.push(p); }
  save(); say('Conectado', 'ok');
  location.href = `pad.html?srv=${encodeURIComponent(p.addr)}&k=${encodeURIComponent(p.pin)}`;
}

// PC encontrado (WiFi o cable): si ya lo conocemos se reconecta solo; si no, se pide su PIN
function found(addr, name) {
  const saved = pcs.find(p => !p.bt && ((name && p.name === name) || p.addr === addr));
  if (saved) {
    if (saved.addr !== addr) saved.alts = [saved.addr, ...(saved.alts || [])].filter((a, i, l) => a !== addr && l.indexOf(a) === i).slice(0, 6);
    saved.addr = addr; save(); connect(saved); return;
  }
  say('PC encontrado: ' + (name || addr) + '. Escribe su PIN.', 'ok');
  const [ip, port] = addr.split(':');
  ask({ title: 'Conectar con ' + (name || ip), ip, port }, (a, pin) => connect({ addr: a, pin, name: name || '' }));
}

// ---- QR del panel (solo WiFi): http://IP:PUERTO/?k=PIN ----
function fromUrl(text) {
  try {
    const u = new URL(text.trim()), k = u.searchParams.get('k');
    if (!/^https?:$/.test(u.protocol) || !u.hostname || !k) return null;
    const port = u.protocol === 'https:' && u.port ? +u.port - 1 : (u.port || 8765);   // el https del navegador va en puerto + 1
    return { addr: `${u.hostname}:${port}`, pin: k, name: '' };
  } catch (e) { return null; }
}
let stream = null, scanning = false;
async function startScan() {
  $('scanmsg').textContent = 'Apunta al código QR que sale en el panel de PC Remote del ordenador';
  $('scanov').classList.add('show');
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
  } catch (e) {
    $('scanmsg').textContent = 'No se pudo abrir la cámara. Da permiso a la app o usa «Escribir dirección y PIN».';
    return;
  }
  const v = $('vid'); v.srcObject = stream; await v.play().catch(() => {});
  scanning = true;
  const cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });
  (function tick() {
    if (!scanning) return;
    if (v.videoWidth) {
      const sc = Math.min(1, 640 / v.videoWidth); cv.width = v.videoWidth * sc; cv.height = v.videoHeight * sc;
      cx.drawImage(v, 0, 0, cv.width, cv.height);
      const code = jsQR(cx.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height, { inversionAttempts: 'dontInvert' });
      if (code) {
        const p = fromUrl(code.data);
        if (p) { stopScan(); const old = pcs.find(x => x.addr === p.addr); if (old) { old.pin = p.pin; connect(old); } else connect(p); return; }
        $('scanmsg').textContent = 'Ese código no es de PC Remote. Usa el que sale en el panel del PC.';
      }
    }
    setTimeout(tick, 120);
  })();
}
function stopScan() {
  scanning = false; $('scanov').classList.remove('show');
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
}
$('scanbtn').onclick = startScan; $('scanclose').onclick = stopScan;

// ---- buscar el PC en la WiFi (sin QR): se prueban las direcciones de la red del movil ----
let finding = false;
async function probe(addr, ms) {
  try { const j = await (await fetch(`http://${addr}/hello`, { signal: timeout(ms), cache: 'no-store' })).json(); return j && j.app === 'pcremote' ? j : null; }
  catch (e) { return null; }
}
async function findPc() {
  if (finding) return; finding = true;
  const port = 8765, cand = [];
  const add = a => { if (!cand.includes(a)) cand.push(a); };
  pcs.filter(p => !p.bt).forEach(p => [p.addr, ...(p.alts || [])].forEach(add));   // direcciones con las que ya funciono
  const nets = [];
  const P = BTP();
  if (P) { try { (await P.localIps()).ips.forEach(ip => nets.push(ip.split('.').slice(0, 3).join('.'))); } catch (e) {} }   // la red de este movil
  pcs.filter(p => !p.bt).forEach(p => { const m = /^(\d+\.\d+\.\d+)\.\d+:/.exec(p.addr); if (m) nets.push(m[1]); });
  if (!nets.length) nets.push('192.168.0', '192.168.1', '192.168.43', '192.168.100', '10.0.0');   // sin saber la red: las mas comunes
  for (const n of [...new Set(nets)]) for (let i = 1; i < 255; i++) add(`${n}.${i}:${port}`);
  const hit = []; let done = 0, next = 0;
  const tick = () => say(`Buscando el PC en la WiFi… ${Math.round(done * 100 / cand.length)}%`);
  tick();
  const worker = async () => {
    while (next < cand.length && !hit.length) {
      const a = cand[next++], j = await probe(a, 700);
      done++; if (j) hit.push({ addr: a, name: j.name }); if (done % 20 === 0) tick();
    }
  };
  await Promise.all(Array.from({ length: 48 }, worker));
  finding = false;
  if (!hit.length) { say('No se encontró ningún PC. Comprueba que PC Remote está abierto y que el móvil está en la misma WiFi que el PC; o usa «Escribir dirección y PIN».', 'err'); return; }
  found(hit[0].addr, hit[0].name);
}
$('findbtn').onclick = findPc;

// ---- cable USB (depuracion USB): el PC abre localhost:8765 en el movil ----
$('usbbtn').onclick = async () => {
  say('Buscando el PC por el cable…');
  const j = await probe('localhost:8765', 2500);
  if (!j) { say('No se encuentra el PC por cable. Conecta el cable, activa «Depuración USB» en el móvil, acepta el aviso y abre PC Remote en el PC.', 'err'); return; }
  found('localhost:8765', j.name);
};

$('manualbtn').onclick = () => ask({ title: 'Conectar con el PC', manual: true }, (addr, pin) => {
  const old = pcs.find(x => x.addr === addr);
  if (old) { old.pin = pin; connect(old); } else connect({ addr, pin, name: '' });
});

// ---- Bluetooth: escaner de dispositivos cercanos, como en PC Remote ----
let btDevs = new Map(), btHandles = [], btScanning = false;
function btStatus(t, err, busy) { $('btstat').className = err ? 'err' : ''; $('btstat').innerHTML = (busy ? '<span class="spin"></span>' : '') + esc(t); }
function drawBt() {
  const list = [...btDevs.values()].sort((a, b) => (!!b.computer - !!a.computer) || (!!b.paired - !!a.paired) || String(a.name || '').localeCompare(String(b.name || '')));
  $('btlist').innerHTML = '';
  list.forEach(d => {
    const b = document.createElement('button'); b.className = 'dev' + (d.computer ? ' pcdev' : '');
    b.innerHTML = `<div class="ic">${d.computer ? '🖥' : '📱'}</div><div class="nm"><b>${esc(d.name || d.address)}</b><span>${d.computer ? 'Ordenador · ' : ''}${d.paired ? 'Emparejado' : 'Nuevo: se empareja al tocarlo'}</span></div>`;
    b.onclick = () => btPick(d);
    $('btlist').appendChild(b);
  });
}
async function btClearListeners() { btHandles.forEach(h => { try { h.remove(); } catch (e) {} }); btHandles = []; }
async function btScan() {
  const P = BTP(); if (!P) return;
  await btClearListeners();
  btHandles.push(await P.addListener('found', d => {
    const old = btDevs.get(d.address) || {};
    btDevs.set(d.address, { ...old, ...d, name: d.name || old.name, paired: d.paired || old.paired, computer: d.computer || old.computer });
    drawBt();
  }));
  btHandles.push(await P.addListener('scanEnd', () => { btScanning = false; btStatus(btDevs.size ? 'Toca tu PC. Si no aparece, pulsa «Buscar de nuevo».' : 'No se encontró ningún dispositivo. Abre Configuración > Bluetooth en el PC y pulsa «Buscar de nuevo».', !btDevs.size); }));
  try { await P.scan(); btScanning = true; btStatus('Buscando dispositivos cercanos…', false, true); }
  catch (e) { btStatus(errText(e), true); }
}
async function openBt() {
  const P = BTP();
  if (!P) { say('El Bluetooth solo está en la app del móvil.', 'err'); return; }
  btDevs = new Map(); drawBt(); $('btov').classList.add('show'); btStatus('Preparando…', false, true);
  try {
    const r = await P.devices();
    if (!r.enabled) { btStatus('Activa el Bluetooth del móvil y pulsa «Buscar de nuevo».', true); return; }
    r.devices.forEach(d => btDevs.set(d.address, d)); drawBt();
  } catch (e) { btStatus(errText(e), true); return; }
  btScan();
}
$('btbtn').onclick = openBt;
$('btagain').onclick = () => { const P = BTP(); if (P) { P.stopScan().catch(() => {}); } btScan(); };
$('btclose').onclick = async () => { const P = BTP(); if (P) { P.stopScan().catch(() => {}); P.close().catch(() => {}); } await btClearListeners(); $('btov').classList.remove('show'); };

async function btPick(d) {
  const P = BTP(); P.stopScan().catch(() => {});
  if (!d.paired) {
    btStatus('Emparejando con ' + (d.name || d.address) + '… acepta el aviso en el móvil y en el PC', false, true);
    try { await P.pair({ address: d.address }); d.paired = true; drawBt(); } catch (e) { btStatus(errText(e), true); return; }
  }
  const known = pcs.find(x => x.bt === d.address);
  if (known && known.pin) { btProbe({ ...known, name: d.name || known.name }); return; }
  btStatus('');
  ask({ title: 'Conectar con ' + (d.name || 'el PC') + ' por Bluetooth' }, (a, pin) => btProbe({ bt: d.address, name: d.name || '', pin }));
}

// Se comprueba el canal y el PIN antes de abrir el mando (el PC contesta y cierra sin crear jugador)
async function btProbe(p) {
  const P = BTP();
  btStatus('Conectando con ' + (p.name || 'el PC') + '…', false, true);
  const h = await P.addListener('status', e => btStatus(e.text, false, true));
  try {
    await P.open({ address: p.bt, uuid: BT_UUID, hello: JSON.stringify({ k: p.pin, probe: true }) });
  } catch (e) {
    h.remove();
    const m = errText(e);
    btStatus(m, true);
    if (/PIN/.test(m)) { delete p.pin; ask({ title: 'PIN incorrecto: míralo en el panel del PC' }, (a, pin) => btProbe({ ...p, pin })); }
    return;
  }
  h.remove(); await P.close().catch(() => {});
  p.last = Date.now();
  const old = pcs.find(x => x.bt === p.bt); if (old) Object.assign(old, p); else pcs.push(p);
  save(); btStatus('Conectado', false);
  await btClearListeners();
  setTimeout(() => btPlay(p), 600);
}
function btPlay(p) {
  const P = BTP(); if (P) P.close().catch(() => {});
  location.href = 'pad.html?bt=' + encodeURIComponent(p.bt) + '&k=' + encodeURIComponent(p.pin) + '&n=' + encodeURIComponent(p.name || '');
}
// ---- la pantalla se adapta a la via elegida (WiFi, Bluetooth o cable); se recuerda la ultima ----
function setMode(m) {
  document.querySelectorAll('#modes button').forEach(b => b.classList.toggle('cur', b.dataset.m === m));
  document.querySelectorAll('.mode').forEach(d => d.classList.toggle('cur', d.dataset.m === m));
  try { localStorage.setItem('pcr_mode', m); } catch (e) {}
  say('');
}
document.querySelectorAll('#modes button').forEach(b => b.onclick = () => setMode(b.dataset.m));
let mode = 'wifi'; try { mode = localStorage.getItem('pcr_mode') || 'wifi'; } catch (e) {}
setMode(['wifi', 'bt', 'usb'].includes(mode) ? mode : 'wifi');

// ---- actualizar la app: se mira version.json en GitHub; si hay una nueva se baja el APK y Android pide instalarla encima ----
const UPDATE_URL = 'https://raw.githubusercontent.com/Davfre3/Pc-Remote/main/releases/version.json';
const vt = v => (String(v).match(/\d+/g) || []).slice(0, 4).map(Number);
const newer = (a, b) => { const x = vt(a), y = vt(b); for (let i = 0; i < 4; i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d > 0; } return false; };
async function checkUpdate() {
  const P = BTP(); if (!P || !P.appVersion) return;
  let cur = '';
  try { cur = (await P.appVersion()).version; $('appver').textContent = 'v' + cur; } catch (e) { return; }
  try {
    const j = await (await fetch(UPDATE_URL + '?t=' + Date.now(), { signal: timeout(8000), cache: 'no-store' })).json();
    if (!j.apk || !newer(j.version, cur)) return;
    $('upd').classList.add('show');
    $('updt').textContent = 'Versión nueva: ' + j.version;
    $('updd').textContent = j.notes || 'Se instala encima y conserva tus PC guardados.';
    $('updb').onclick = async () => {
      $('updb').disabled = true; $('updd').textContent = 'Descargando… 0%';
      const h = await P.addListener('updateProgress', e => { $('updd').textContent = 'Descargando… ' + e.pct + '%'; });
      try {
        await P.installApk({ url: j.apk });
        $('updd').textContent = 'Pulsa «Instalar» en el aviso de Android.';
      } catch (e) {
        $('updd').textContent = errText(e); $('updb').disabled = false;
      }
      h.remove();
    };
  } catch (e) { /* sin internet: no pasa nada */ }
}
checkUpdate();
render();
</script>
